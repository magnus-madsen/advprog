name: Build

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

# Cancel previous runs if the PR is updated, but let pushes to master finish
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: build-${{ github.ref }}

jobs:
  build-slides:
    runs-on: ubuntu-latest
    env:
      TYPST_VERSION: 0.15.1
    steps:
      - name: Check out master
        uses: actions/checkout@v7
      - name: Install XeLaTeX, latexmk, pdftoppm, and the emoji font
        # fonts-noto-color-emoji is for the Typst deck: Typst embeds only its
        # own text fonts, so without an emoji font the runner renders the
        # emoji in welcome.typ as blanks instead of failing the build.
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-color-emoji \
            latexmk \
            poppler-utils \
            texlive-fonts-extra \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-xetex
      - name: Make Fira available to XeLaTeX
        # The metropolis theme looks up "Fira Sans" by name, which goes through
        # fontconfig. TeX Live ships the fonts but does not register them there,
        # so without this the slides silently fall back to Latin Modern.
        run: |
          sudo mkdir -p /usr/local/share/fonts
          sudo cp /usr/share/texlive/texmf-dist/fonts/opentype/public/fira/*.otf /usr/local/share/fonts/
          sudo fc-cache -f
      - name: Install Typst
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/typst/typst/releases/download/v$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz" \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" \
              typst-x86_64-unknown-linux-musl/typst
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Make slides
        run: make -C slides

  build-mdbook:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.4
    steps:
      - name: Check out master
        uses: actions/checkout@v7
      - name: Install mdbook
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/rust-lang/mdBook/releases/download/v$MDBOOK_VERSION/mdbook-v$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build mdbook
        run: mdbook build
